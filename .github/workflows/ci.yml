name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.18.2

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files "*.go"))"
          if [ -n "$unformatted" ]; then
            printf "Go files are not gofmt-formatted:\n%s\n" "$unformatted"
            exit 1
          fi

      - name: Verify build, tests, vet, and architecture
        run: make verify

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check coverage
        run: |
          go test ./... -covermode=atomic -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          minimum="60.0"

          awk -v total="$total" -v minimum="$minimum" 'BEGIN {
            if (total + 0 < minimum + 0) {
              printf "coverage %.1f%% is below required %.1f%%\n", total, minimum
              exit 1
            }
            printf "coverage %.1f%% meets required %.1f%%\n", total, minimum
          }'

          {
            printf "## Coverage\n\n"
            printf "Total statement coverage: **%s%%**\n\n" "$total"
            printf "Required minimum: **%s%%**\n" "$minimum"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run race detector
        run: make test-race

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install audit tools
        run: |
          make install-tools
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run security and script audits
        run: make audit

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Validate release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
